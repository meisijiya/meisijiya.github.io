<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- v0.4.25 PR-3: 浅米黄纸纹背景（hexo 博客气质）
       设计 doc §3.2：暖白底色 #F8F5EE + feTurbulence 细噪点（baseFrequency=0.9 高频 = 细腻纸纹），
       stitchTiles="stitch" 确保 200×200 平铺无缝。feColorMatrix 把噪点染色到米黄系，alpha=0.06 极淡不喧宾夺主。
       体积 < 1KB，独立文件可被 HTTP 缓存复用，gzip 后 < 500B。-->
  <defs>
    <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.95
                             0 0 0 0 0.92
                             0 0 0 0 0.85
                             0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#F8F5EE"/>
  <rect width="200" height="200" filter="url(#paper-noise)"/>
</svg>